<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planet Jumping</title>
<style>
/* 2. FONTS */
@font-face { font-family: 'SF Pro'; font-weight: 400; src: local('SF Pro Display Regular'), local('SF Pro Text Regular'), local('SF-Pro-Display-Regular'); }
@font-face { font-family: 'SF Pro'; font-weight: 700; src: local('SF Pro Display Bold'), local('SF Pro Text Bold'), local('SF-Pro-Display-Bold'); }
@font-face { font-family: 'SF Pro Thin'; font-weight: 100; src: local('SF Pro Display Thin'), local('SF Pro Text Thin'), local('SF-Pro-Display-Thin'); }
@font-face { font-family: 'Aalto'; font-weight: 400; src: local('Aalto'); }

:root {
  font-family: 'SF Pro', Arial, sans-serif;
  color: #fff;
  background: #090807;
  font-synthesis: none;
}

/* 5. LAYOUT CSS (exact values) */
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden}
.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
.backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
.background{object-fit:cover;opacity:0;transition:opacity .8s ease} .background.is-visible{opacity:1}
.shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}

HEADER  .header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);display:flex;justify-content:space-between;align-items:center}
        .header-actions{margin-left:auto;display:flex;align-items:center}
        .nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);
             background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:999px}
        .nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1}
        .nav a.active{background:#fff;color:#000}
        .menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000;cursor:pointer}

SIDEBAR .planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px}
        .planet-item{display:flex;align-items:center;min-height:20px}
        .planet-item.active{font-size:18px;font-weight:700;gap:8px}
        .planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}

PORTAL  .portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
        .portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
        .portal-heading strong{font-size:18px;margin-left:8px}
        .portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;
                border-radius:90px;background:transparent;cursor:pointer;box-shadow:none;transform:none!important}
        .portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
        .portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}

CONTENT .planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);
                        display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
        .planet-content h1{font-family:Aalto,'Arial Narrow',sans-serif;font-size:clamp(128px,21.8vw,314px);
          font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;transform:translateX(-32px);opacity:0}
        .planet-content dl{width:min(447px,34vw);margin:0;font-size:16px}
        .fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;
              border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
        .fact:last-child{border-bottom:0} .fact dt{font-weight:700} .fact dd{margin:0}

MISC    .transition-layer{display:none} .scene-canvas{display:none}
        .loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;
                 font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
        .experience.is-loading .loading{opacity:.8}
        .experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
        .experience.is-transitioning .shade{opacity:1}
        .experience.is-committing .background{transition:none!important}

/* 6. PRELOADER */
.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
.preloader.is-background{z-index:0} .preloader.is-background .preloader-shade{opacity:0}
.floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);
  will-change:left,top,width,height,transform;
  transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1)}
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:37px;height:36px;transform:none}
.floating-logo.is-settled{z-index:5}
.preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;
  gap:4px;transform:translateX(-50%);font-family:'SF Pro',Arial,sans-serif;line-height:1}
.preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;font-size:64px;font-weight:100}
.preloader-count .percent{font-size:24px;padding-bottom:4px}
.preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.preload-complete) .custom-cursor{opacity:0!important}

/* 9. CUSTOM CURSOR */
html,body,button,a,.portal{cursor:none!important}
.custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;
  pointer-events:none;opacity:0;transition:opacity .2s ease}
.custom-cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-dot{width:12px;height:12px;background:#fff}
.cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);
  transition:transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
.cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);
  font:16px/1.2 'SF Pro',Arial,sans-serif;white-space:nowrap;opacity:0;
  transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}

/* 10. ENTRANCE / SWITCH ANIMATIONS */
body:not(.intro-ready) .header,body:not(.intro-ready) .planet-list,body:not(.intro-ready) .planet-content h1,body:not(.intro-ready) .planet-content .fact{opacity:0}
.intro-ready .header       { animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both }
.intro-ready .planet-list  { animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both }
.content-revealing h1      { animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both }
.content-revealing .fact:nth-child(1) { animation:fact-rise .72s cubic-bezier(.22,1,.36,1) .52s both }
.content-revealing .fact:nth-child(2) { animation:fact-rise .72s cubic-bezier(.22,1,.36,1) .68s both }
.content-revealing .fact:nth-child(3) { animation:fact-rise .72s cubic-bezier(.22,1,.36,1) .84s both }
.content-revealing .fact:nth-child(4) { animation:fact-rise .72s cubic-bezier(.22,1,.36,1) 1s both }
.mask-revealing .portal-heading { animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both }
.planet-list.is-switching .planet-item:nth-child(1) { animation:menu-row .58s cubic-bezier(.22,1,.36,1) .02s both }
.planet-list.is-switching .planet-item:nth-child(2) { animation:menu-row .58s cubic-bezier(.22,1,.36,1) .05s both }
.planet-list.is-switching .planet-item:nth-child(3) { animation:menu-row .58s cubic-bezier(.22,1,.36,1) .08s both }
.planet-list.is-switching .planet-item:nth-child(4) { animation:menu-row .58s cubic-bezier(.22,1,.36,1) .11s both }
.planet-list.is-switching .planet-item:nth-child(5) { animation:menu-row .58s cubic-bezier(.22,1,.36,1) .14s both }
.planet-list.is-switching .planet-item:nth-child(6) { animation:menu-row .58s cubic-bezier(.22,1,.36,1) .17s both }
.planet-list.is-switching .planet-item:nth-child(7) { animation:menu-row .58s cubic-bezier(.22,1,.36,1) .2s both }
.planet-list.is-switching .planet-item:nth-child(8) { animation:menu-row .58s cubic-bezier(.22,1,.36,1) .23s both }
.planet-list.is-switching .planet-item.active:before { animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both }

@keyframes reveal-down   {from{opacity:0;filter:blur(8px);transform:translateY(-18px)}      to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes reveal-side   {from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}  to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes title-rise    {from{opacity:0;filter:blur(12px);transform:translate(-32px,42px)} to{opacity:1;filter:blur(0);transform:translate(-32px,0)}}
@keyframes fact-rise     {from{opacity:0;filter:blur(7px);transform:translateY(18px)}       to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(22px)}       to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes menu-row      {from{opacity:.35;transform:translateX(-8px)}                      to{opacity:1;transform:translateX(0)}}
@keyframes active-dot    {from{opacity:0;transform:scale(0)}                                to{opacity:1;transform:scale(1)}}

/* 11. RESPONSIVE */
@media(max-width:900px){
  .nav{display:none}
  .portal-wrap{width:min(300px,48vw)}
  .planet-content h1{font-size:clamp(105px,24vw,190px)}
  .planet-content dl{width:43vw}
  .fact{grid-template-columns:110px 1fr}
  .planet-list{font-size:14px} .planet-item.active{font-size:16px}
}
@media(max-width:640px){
  .experience{min-height:600px}
  .planet-list{display:none}
  .portal-wrap{top:44%;width:min(260px,66vw)}
  .planet-content{left:18px;right:18px;bottom:18px;display:block}
  .planet-content h1{font-size:clamp(98px,30vw,160px);margin-bottom:20px}
  .planet-content dl{width:100%;font-size:13px}
  .fact{grid-template-columns:92px 1fr;padding:5px 0}
  .portal-heading{font-size:14px} .portal-heading strong{font-size:16px}
  .menu{height:38px} .portal{border-radius:70px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.portal{transform:none!important}}
</style>
</head>
<body>

<main class="experience" data-planet="mars">
  <div class="backgrounds" aria-hidden="true">
    <video id="mars-background"  class="background is-visible" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4" muted playsinline preload="auto"></video>
    <video id="earth-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
    <video id="venus-background" class="background"            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>
  </div>
  <div class="preloader" id="preloader" aria-label="Loading Mars">
    <video id="preloader-video" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4" muted playsinline preload="auto"></video>

  </div>

<script>
const planets = ['Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus','Neptune'];
const BASE = "https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P";
const TO_EARTH = `${BASE}/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4`;
const TO_VENUS = `${BASE}/b30f64d9-1637-477a-83df-d0fc6461a422.mp4`;
const MERCURY = `${BASE}/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg`;

const states = {
 mars:  { name:'Mars',  next:'Earth',   number:'[03]', portal:TO_EARTH,  background:'mars-background',
   facts:[['Distance:','About 228 million km (1.5 astronomical units).'],
          ['Year:','One Martian year is equal to 687 Earth days.'],
          ['Temperature:','Around -60 °C, dropping to -125 °C at the poles in winter.'],
          ['Atmosphere:','Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']] },
 earth: { name:'Earth', next:'Venus',   number:'[02]', portal:TO_VENUS,  background:'earth-background',
   facts:[['Distance:','149.6 million km from the Sun.'],
          ['Year:','365.25 Earth days.'],
          ['Temperature:','Average surface temperature around 15 °C.'],
          ['Atmosphere:','Mostly nitrogen and oxygen, supporting life and liquid water.']] },
 venus: { name:'Venus', next:'Mercury', number:'[06]', image:MERCURY,    background:'venus-background',
   facts:[['Distance:','108.2 million km from the Sun.'],
          ['Year:','225 Earth days.'],
          ['Temperature:','Around 465 °C — the hottest planet in the Solar System.'],
          ['Atmosphere:','Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']] }
};

let current = 'mars';
let busy = false;

// DOM Elements
const experience = document.querySelector('.experience');
const planetTitle = document.getElementById('planet-title');
const nextName = document.getElementById('next-name');
const nextNumber = document.getElementById('next-number');
const portalBtn = document.getElementById('portal');
const factsContainer = document.getElementById('facts');
const planetList = document.querySelector('.planet-list');
const portalVideo = document.getElementById('portal-video');
const portalImage = document.getElementById('portal-image');
const portalCanvas = document.getElementById('portal-canvas');
const sceneCanvas = document.getElementById('scene-canvas');
const ctx = portalCanvas.getContext('2d');
const sceneCtx = sceneCanvas.getContext('2d');
const transitionVideo = document.getElementById('transition-video');

const preloader = document.getElementById('preloader');
const preloaderVideo = document.getElementById('preloader-video');
const preloaderValue = document.getElementById('preloader-value');
const preloaderCount = document.getElementById('preloader-count');
const floatingLogo = document.getElementById('floating-logo');

let isFirstRender = true;

function render() {
  const state = states[current];
  experience.setAttribute('data-planet', current);
  planetTitle.textContent = state.name.toUpperCase();
  nextName.textContent = state.next;
  nextNumber.textContent = state.number;
  portalBtn.setAttribute('aria-label', `Travel to ${state.next}`);
  
  // Build facts
  factsContainer.innerHTML = '';
  state.facts.forEach(f => {
    const div = document.createElement('div');
    div.className = 'fact';
    div.innerHTML = `<dt>${f[0]}</dt><dd>${f[1]}</dd>`;
    factsContainer.appendChild(div);
  });
  
  // Build planet list
  planetList.innerHTML = '';
  planets.forEach(p => {
    const span = document.createElement('span');
    span.className = `planet-item${p === state.name ? ' active' : ''}`;
    span.textContent = p;
    planetList.appendChild(span);
  });
  
  if (!isFirstRender) {
    planetList.classList.remove('is-switching');
    void planetList.offsetWidth;
    planetList.classList.add('is-switching');
  }
  isFirstRender = false;

  // Background
  document.querySelectorAll('.background').forEach(bg => bg.classList.remove('is-visible'));
  document.getElementById(state.background).classList.add('is-visible');
  
  // Portal media
  if (state.image) {
    portalImage.src = state.image;
    portalImage.style.visibility = 'visible';
    portalVideo.style.visibility = 'hidden';
  } else {
    if (portalVideo.src !== state.portal) {
      portalVideo.src = state.portal;
    }
    portalVideo.style.visibility = 'visible';
    portalImage.style.visibility = 'hidden';
    portalVideo.play().catch(e => console.log('Auto-play prevented', e));
  }
}

// 6. PRELOADER
function runPreloader() {
  if (preloaderVideo.readyState >= 1) {
    startVideo();
  } else {
    preloaderVideo.addEventListener('loadedmetadata', startVideo, { once: true });
  }

  function startVideo() {
    preloaderVideo.playbackRate = Math.max(0.25, preloaderVideo.duration / 3);
    preloaderVideo.play().catch(() => finishPreloader());
  }

  let finished = false;
  function finishPreloader() {
    if(finished) return;
    finished = true;
    preloaderValue.textContent = '100';
    preloaderCount.classList.add('is-leaving');
    floatingLogo.classList.add('is-docked');
    preloader.classList.add('is-background');
    document.body.classList.add('preload-complete');
    startExperience();
    
    setTimeout(() => { preloaderCount.remove(); }, 750);
    setTimeout(() => { floatingLogo.classList.add('is-settled'); }, 2000);
  }

  preloaderVideo.addEventListener('ended', finishPreloader);
  
  function updatePreloaderCount() {
    if(!finished && preloaderVideo.duration) {
      preloaderValue.textContent = Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100);
    }
    if(!finished) requestAnimationFrame(updatePreloaderCount);
  }
  requestAnimationFrame(updatePreloaderCount);
}

async function startExperience() {
  const state = states[current];
  if (!state.image && portalVideo.readyState < 3) {
    await new Promise(r => portalVideo.addEventListener('canplaythrough', r, { once: true }));
  }
  await revealMask();
  document.body.classList.add('intro-ready');
  setTimeout(() => revealPlanetContent(), 850);
}

// Easing
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function animateValue(setter, duration) {
  return new Promise(resolve => {
    let start = performance.now();
    function step(now) {
      let t = Math.min((now - start) / duration, 1);
      setter(easeInOutCubic(t));
      if (t < 1) requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });
}

function revealMask() {
  experience.classList.remove('mask-revealing');
  void experience.offsetWidth;
  experience.classList.add('mask-revealing');
  maskScale = 0;
  return animateValue(v => { maskScale = v; }, 1050);
}

function revealPlanetContent() {
  experience.classList.remove('content-revealing');
  void experience.offsetWidth;
  experience.classList.add('content-revealing');
}

// 7. PORTAL CANVAS & 3D MASK
let maskScale = 1;
let expansion = 0;
let canvasOpacity = 1;
let transitionActive = false;
let frozenScene = false;

let targetX = 0, targetY = 0;
let rotX = 0, rotY = 0;
let lastTime = performance.now();

function resizeCanvas() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  portalCanvas.width = window.innerWidth * d;
  portalCanvas.height = window.innerHeight * d;
  portalCanvas.style.width = window.innerWidth + 'px';
  portalCanvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
  
  if (!frozenScene) {
    sceneCanvas.width = window.innerWidth * d;
    sceneCanvas.height = window.innerHeight * d;
    sceneCanvas.style.width = window.innerWidth + 'px';
    sceneCanvas.style.height = window.innerHeight + 'px';
    sceneCtx.setTransform(d, 0, 0, d, 0, 0);
  }
}
window.addEventListener('resize', resizeCanvas);

function drawCover(media, context) {
  if(!media) return;
  const mw = media.videoWidth || media.naturalWidth;
  const mh = media.videoHeight || media.naturalHeight;
  if (!mw || !mh) return;
  const scale = Math.max(window.innerWidth / mw, window.innerHeight / mh);
  const w = mw * scale;
  const h = mh * scale;
  context.drawImage(media, (window.innerWidth - w)/2, (window.innerHeight - h)/2, w, h);
}

function drawShade(context) {
  const grad = context.createLinearGradient(0, window.innerHeight * 0.52, 0, window.innerHeight);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.88)');
  context.fillStyle = grad;
  context.fillRect(0, window.innerHeight * 0.52, window.innerWidth, window.innerHeight * 0.48);
}

portalBtn.addEventListener('pointerleave', () => {
  if(busy) return;
  targetX = 0; targetY = 0;
});
portalBtn.addEventListener('pointermove', (e) => {
  if(busy || !window.matchMedia('(hover: hover)').matches) return;
  targetY = (e.clientX / window.innerWidth - 0.5) * 37.4;
  targetX = (e.clientY / window.innerHeight - 0.5) * -33;
});

function draw() {
  const now = performance.now();
  const dt = Math.min(40, now - lastTime);
  lastTime = now;

  rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
  rotY += (targetY - rotY) * Math.min(1, dt * 0.009);

  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  if (frozenScene) {
    ctx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
    drawShade(ctx);
  }

  const rect = portalBtn.getBoundingClientRect();
  const rectCx = rect.left + rect.width / 2;
  const rectCy = rect.top + rect.height / 2;
  const e = expansion;
  
  const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
  const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;
  const baseW = rect.width + (window.innerWidth - rect.width) * e;
  const baseH = rect.height + (window.innerHeight - rect.height) * e;
  const scale = e ? 1 : maskScale;
  const w = baseW * scale;
  const h = baseH * scale;
  let r = 90 * (1 - e) * scale;
  r = Math.min(r, w/2, h/2);
  const rx = rotX * (1 - e);
  const ry = rotY * (1 - e);

  if (w > 1 && h > 1) {
    ctx.save();
    ctx.globalAlpha = canvasOpacity;

    ctx.beginPath();
    const arcs = [
      { cx: w/2 - r, cy: -h/2 + r, start: -Math.PI/2, end: 0 },
      { cx: w/2 - r, cy: h/2 - r, start: 0, end: Math.PI/2 },
      { cx: -w/2 + r, cy: h/2 - r, start: Math.PI/2, end: Math.PI },
      { cx: -w/2 + r, cy: -h/2 + r, start: Math.PI, end: Math.PI*1.5 }
    ];

    let firstPoint = true;
    arcs.forEach(arc => {
      for (let i = 0; i <= 10; i++) {
        const theta = arc.start + (arc.end - arc.start) * (i / 10);
        const x = arc.cx + r * Math.cos(theta);
        const y = arc.cy + r * Math.sin(theta);
        
        // Project
        const ax = rx * Math.PI / 180;
        const ay = ry * Math.PI / 180;
        const xx = x * Math.cos(ay);
        const yy = y * Math.cos(ax);
        const z = x * Math.sin(ay) - y * Math.sin(ax);
        const p = 850 / (850 + z);
        const sx = cx + xx * p;
        const sy = cy + yy * p;
        
        if (firstPoint) {
          ctx.moveTo(sx, sy);
          firstPoint = false;
        } else {
          ctx.lineTo(sx, sy);
        }
      }
    });
    ctx.closePath();
    ctx.clip();
    
    ctx.fillStyle = '#030303';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    const media = transitionActive ? transitionVideo : (states[current].image ? portalImage : portalVideo);
    drawCover(media, ctx);
    
    if (transitionActive) drawShade(ctx);
    
    ctx.restore();
  }
  
  requestAnimationFrame(draw);
}

// 8. TRAVEL TRANSITION
async function travel() {
  if (busy || current === 'venus') return;
  busy = true;
  targetX = 0; targetY = 0;
  
  const next = current === 'mars' ? 'earth' : 'venus';
  transitionVideo.src = states[current].portal;
  transitionVideo.load();
  experience.classList.add('is-loading');
  
  try {
    await Promise.race([
      new Promise(r => transitionVideo.addEventListener('canplaythrough', r, { once: true })),
      new Promise((_, reject) => transitionVideo.addEventListener('error', reject, { once: true })),
      new Promise(r => setTimeout(r, 1600))
    ]);

    experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
    experience.classList.add('is-transitioning');
    
    transitionVideo.currentTime = 0;
    transitionVideo.playbackRate = 1.3;
    canvasOpacity = 1;
    transitionActive = true;
    
    await transitionVideo.play();
    
    await animateValue(v => { expansion = v; }, 1100);
    
    await new Promise(r => {
      if (transitionVideo.ended) r();
      else transitionVideo.addEventListener('ended', r, { once: true });
    });
    
    // Freeze frame
    sceneCanvas.width = window.innerWidth * (window.devicePixelRatio || 1);
    sceneCanvas.height = window.innerHeight * (window.devicePixelRatio || 1);
    sceneCtx.clearRect(0, 0, sceneCanvas.width, sceneCanvas.height);
    drawCover(transitionVideo, sceneCtx);
    frozenScene = true;
    
    current = next;
    experience.classList.add('is-committing');
    render();
    
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    
    transitionActive = false;
    expansion = 0;
    maskScale = 0;
    canvasOpacity = 1;
    experience.classList.remove('is-transitioning', 'is-committing');
    
    frozenScene = false;
    
    const maskReveal = revealMask();
    setTimeout(() => revealPlanetContent(), 100);
    await maskReveal;
    
    setTimeout(() => {
      transitionVideo.removeAttribute('src');
      transitionVideo.load();
      busy = false;
    }, 450);
    
  } catch (err) {
    console.error("Travel error", err);
    transitionActive = false;
    expansion = 0;
    maskScale = 1;
    canvasOpacity = 1;
    experience.classList.remove('is-loading', 'is-transitioning', 'is-committing', 'content-revealing', 'mask-revealing');
    busy = false;
  }
}
portalBtn.addEventListener('click', travel);

// 9. CUSTOM CURSOR
const customCursor = document.querySelector('.custom-cursor');
const cursorOrbit = document.querySelector('.cursor-orbit');
let cursorX = window.innerWidth / 2, cursorY = window.innerHeight / 2;
let targetCursorX = cursorX, targetCursorY = cursorY;
let cursorVisible = false;

document.addEventListener('pointermove', e => {
  targetCursorX = e.clientX;
  targetCursorY = e.clientY;
  if (!cursorVisible) {
    customCursor.classList.add('is-visible');
    cursorVisible = true;
  }
});
document.addEventListener('mouseleave', () => {
  customCursor.classList.remove('is-visible');
  cursorVisible = false;
});
portalBtn.addEventListener('pointerenter', () => customCursor.classList.add('is-enter'));
portalBtn.addEventListener('pointerleave', () => customCursor.classList.remove('is-enter'));

function cursorLoop() {
  cursorX += (targetCursorX - cursorX) * 0.2;
  cursorY += (targetCursorY - cursorY) * 0.2;
  customCursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
  requestAnimationFrame(cursorLoop);
}

// 12. BOOT ORDER
document.querySelectorAll('.background').forEach(v => {
  if (v.pause) { v.pause(); v.currentTime = 0; }
});
resizeCanvas();
render();
requestAnimationFrame(draw);
requestAnimationFrame(cursorLoop);
runPreloader();

</script>
